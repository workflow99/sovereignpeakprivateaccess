<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WHT401k Coin Preview</title>
  <style>
    body {
      background: #0a0a0c;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 40px;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8a8a8a;
    }
    .sizes {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .sizes svg {
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
      border-radius: 50%;
    }
    .card {
      background: #111318;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 260px;
    }
    .card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .card-name {
      font-size: 14px;
      font-weight: 600;
    }
    .card-meta {
      font-size: 12px;
      color: #8a8a8a;
    }
    .card-price {
      margin-left: auto;
      font-size: 14px;
      font-weight: 700;
      color: #D4AF37;
    }
  </style>
</head>
<body>

  <div class="stage">
    <div class="label">Sizes (28px / 48px / 96px / 192px)</div>
    <div class="sizes">
      <!-- 28px -->
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="16" fill="#0B1220" />
        <circle cx="16" cy="16" r="14" stroke="#D4AF37" stroke-width="1.5" />
        <text x="16" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">W</text>
        <text x="16" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#D4AF37">401k</text>
      </svg>

      <!-- 48px -->
      <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="16" fill="#0B1220" />
        <circle cx="16" cy="16" r="14" stroke="#D4AF37" stroke-width="1.5" />
        <text x="16" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">W</text>
        <text x="16" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#D4AF37">401k</text>
      </svg>

      <!-- 96px -->
      <svg width="96" height="96" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="16" fill="#0B1220" />
        <circle cx="16" cy="16" r="14" stroke="#D4AF37" stroke-width="1.5" />
        <text x="16" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">W</text>
        <text x="16" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#D4AF37">401k</text>
      </svg>

      <!-- 192px -->
      <svg width="192" height="192" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="16" fill="#0B1220" />
        <circle cx="16" cy="16" r="14" stroke="#D4AF37" stroke-width="1.5" />
        <text x="16" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">W</text>
        <text x="16" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#D4AF37">401k</text>
      </svg>
    </div>
  </div>

  <div class="stage">
    <div class="label">In-context (dashboard list card)</div>
    <div class="card">
      <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="16" fill="#0B1220" />
        <circle cx="16" cy="16" r="14" stroke="#D4AF37" stroke-width="1.5" />
        <text x="16" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#FFFFFF">W</text>
        <text x="16" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="700" fill="#D4AF37">401k</text>
      </svg>
      <div class="card-info">
        <span class="card-name">WhitehouseTesla401k</span>
        <span class="card-meta">WHT401k &middot; 4,000 coins</span>
      </div>
      <span class="card-price">$4,000.00</span>
    </div>
  </div>

</body>
</html>
